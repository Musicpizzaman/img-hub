<!doctype html><html lang="en"><head><meta charset="utf-8"><title>IMG Hub test gallery</title>
<style>body{font:16px system-ui;background:#f2f5fa;margin:0;color:#1b2940}main{max-width:1000px;margin:auto;padding:36px}h1{font-size:40px}p{color:#54637c}section{display:flex;gap:24px;flex-wrap:wrap}img.photo{width:420px;height:280px;object-fit:cover;border-radius:16px}.background{width:420px;height:280px;border-radius:16px;margin-top:24px;background-size:cover}button{padding:12px;margin-top:24px}footer{height:1200px}</style></head>
<body><main><h1>A closer look.</h1><p>A local gallery for verifying IMG Hub. Hover a landscape to open it.</p><a id="focus" href="#footer">A normal webpage link</a><section><a id="linked" href="#footer"><img class="photo" id="first" src="/tests/landscape.svg" alt="Cyan mountain landscape"></a><img class="photo" id="second" src="/tests/landscape-2.svg" alt="Violet evening landscape"><img id="small" width="32" height="32" src="/tests/landscape.svg" alt="Small icon"><img class="photo" id="logo" src="/tests/landscape.svg" alt="Site logo"></section><div class="background" id="background" style="background-image:url('/tests/landscape-3.svg')" aria-label="Background landscape"></div><button id="add">Add a dynamic photo</button><footer id="footer"></footer></main>
<script>document.querySelector('#add').onclick=()=>{const image=document.createElement('img');image.id='dynamic';image.className='photo';image.alt='Dynamically loaded landscape';image.src='/tests/landscape-3.svg';document.querySelector('section').append(image)};</script>
</body></html>
