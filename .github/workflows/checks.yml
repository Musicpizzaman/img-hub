name: Check IMG Hub
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps firefox
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:tabs
      - uses: actions/upload-artifact@v4
        with:
          name: img-hub-unsigned
          path: dist/*.zip

  helper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/start.test.cjs
