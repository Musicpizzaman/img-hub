<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IMG Hub preferences</title><link rel="stylesheet" href="options.css"></head>
<body>
  <main>
    <header><img src="icons/icon-48.png" width="48" height="48" alt=""><div><h1>IMG <span>Hub</span></h1><p>Your photos. A closer look.</p></div><small>0.2.0</small></header>
    <form id="preferences">
      <label class="setting"><span><strong>Direct click to open</strong><small>Open photos when clicked. Off keeps website links working.</small></span><input type="checkbox" id="directClick"></label>
      <label class="setting"><span><strong>Hover controls</strong><small>Show the “View image” button over photos.</small></span><input type="checkbox" id="hoverControls"></label>
      <label class="setting"><span><strong>CSS background images</strong><small>Include pictures used as page backgrounds.</small></span><input type="checkbox" id="backgroundImages"></label>
      <label class="setting"><span><strong>Minimum width (pixels)</strong><small>Smallest picture width to show. Uses its full size.</small></span><input type="number" id="minWidth" min="1" max="1000000" step="1" required aria-label="Minimum width in pixels"></label>
      <label class="setting"><span><strong>Hide logos</strong><small>Skip pictures marked as logos.</small></span><input type="checkbox" id="hideLogos"></label>
      <label class="setting"><span><strong>Hide ads</strong><small>Skip pictures in marked ad spaces.</small></span><input type="checkbox" id="hideAds"></label>
      <label class="setting"><span><strong>Hide thumbnails</strong><small>Skip pictures marked as small previews.</small></span><input type="checkbox" id="hideThumbnails"></label>
      <div class="actions"><button type="submit">Save preferences</button><button type="button" id="reset">Reset</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p>These checks are guesses. Turn one off if it hides a picture you want.</p>
    <aside><strong>A few useful keys</strong><p><kbd>Esc</kbd> close · <kbd>←</kbd> <kbd>→</kbd> browse · <kbd>+</kbd> <kbd>−</kbd> zoom<br><kbd>F</kbd> reset · <kbd>0</kbd> original size · Drag to pan</p></aside>
    <footer>Preferences stay in this Firefox profile. No analytics or account needed.</footer>
  </main>
  <script src="core.js"></script><script src="options.js"></script>
</body>
</html>
